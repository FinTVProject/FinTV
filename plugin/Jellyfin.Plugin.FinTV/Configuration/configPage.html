<div id="FinTVConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div class="content-primary">
        <div class="sectionTitleContainer">
            <h2 class="sectionTitle">FinTV</h2>
            <p>Connect this Jellyfin server to FinTV Server. Channels, lineups, and streaming are managed in the FinTV Web UI.</p>
        </div>
        <form id="fintv-bridge-form">
            <div class="inputContainer">
                <label class="inputLabel" for="fintv-server-url">FinTV Server URL</label>
                <input id="fintv-server-url" type="text" is="emby-input" class="emby-input" />
            </div>
            <div class="inputContainer">
                <label class="inputLabel" for="fintv-api-key">API key</label>
                <input id="fintv-api-key" type="password" is="emby-input" class="emby-input" />
            </div>
            <label class="checkboxContainer">
                <input id="fintv-auto-livetv" type="checkbox" is="emby-checkbox" />
                <span>Auto-register Live TV M3U and XMLTV</span>
            </label>
            <label class="checkboxContainer">
                <input id="fintv-write-chapters" type="checkbox" is="emby-checkbox" />
                <span>Write blackframe chapters onto Jellyfin items</span>
            </label>
            <div class="inputContainer">
                <label class="inputLabel" for="fintv-commercial-tag">Commercial library tag</label>
                <input id="fintv-commercial-tag" type="text" is="emby-input" class="emby-input" />
            </div>
            <button is="emby-button" type="submit" class="raised button-submit block">Save</button>
            <button is="emby-button" type="button" id="fintv-sync-now" class="raised block">Sync catalog now</button>
            <button is="emby-button" type="button" id="fintv-blackframe-now" class="raised block">Run blackframe scan</button>
        </form>
        <p class="fieldDescription">Open the FinTV Server Web UI (port 8097) to manage channels. Catalog metadata syncs on a schedule or from Dashboard → Scheduled Tasks → FinTV Catalog Sync.</p>
    </div>
    <script>
        (function () {
            const page = document.getElementById('FinTVConfigPage');
            page.addEventListener('viewshow', async function () {
                const cfg = await ApiClient.getPluginConfiguration('f4e8a2b1-3c5d-4e6f-9a8b-7c6d5e4f3a2b');
                page.querySelector('#fintv-server-url').value = cfg.ServerUrl || '';
                page.querySelector('#fintv-api-key').value = cfg.ApiKey || '';
                page.querySelector('#fintv-auto-livetv').checked = cfg.AutoRegisterLiveTv !== false;
                page.querySelector('#fintv-write-chapters').checked = cfg.WriteChaptersToJellyfin !== false;
                page.querySelector('#fintv-commercial-tag').value = cfg.CommercialLibraryTag || 'fintv-commercial';
            });
            page.querySelector('#fintv-bridge-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                const cfg = await ApiClient.getPluginConfiguration('f4e8a2b1-3c5d-4e6f-9a8b-7c6d5e4f3a2b');
                cfg.ServerUrl = page.querySelector('#fintv-server-url').value;
                cfg.ApiKey = page.querySelector('#fintv-api-key').value;
                cfg.AutoRegisterLiveTv = page.querySelector('#fintv-auto-livetv').checked;
                cfg.WriteChaptersToJellyfin = page.querySelector('#fintv-write-chapters').checked;
                cfg.CommercialLibraryTag = page.querySelector('#fintv-commercial-tag').value;
                await ApiClient.updatePluginConfiguration('f4e8a2b1-3c5d-4e6f-9a8b-7c6d5e4f3a2b', cfg);
                Dashboard.processPluginConfigurationUpdateResult();
            });
            page.querySelector('#fintv-sync-now').addEventListener('click', async function () {
                await ApiClient.ajax({ url: ApiClient.getUrl('FinTV/api/bridge/sync'), type: 'POST' });
                Dashboard.alert('Catalog sync started.');
            });
            page.querySelector('#fintv-blackframe-now').addEventListener('click', async function () {
                await ApiClient.ajax({ url: ApiClient.getUrl('FinTV/api/bridge/blackframe'), type: 'POST' });
                Dashboard.alert('Blackframe scan started.');
            });
        })();
    </script>
</div>
