services:
  channelflow:
    image: ghcr.io/flowmeadow01/channelflow:latest
    container_name: ChannelFlow
    build: .
    ports:
      - "${FINTV_PORT:-8097}:8097"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-fintv}
      POSTGRES_USER: ${POSTGRES_USER:-fintv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintv}
      FINTV_CONFIG: /config
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
      TZ: ${TZ:-America/Chicago}
      FFMPEG_HWACCEL: ${FFMPEG_HWACCEL:-vaapi}
      FFMPEG_VAAPI_DEVICE: ${FFMPEG_VAAPI_DEVICE:-/dev/dri/renderD128}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - fintv-config:/config
      - ${FINTV_MEDIA:-./media}:/media
    restart: unless-stopped

volumes:
  fintv-config:
