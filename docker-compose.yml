services:
  fintv-server:
    image: ghcr.io/fintvproject/fintv-server:latest
    build: .
    ports:
      - "${FINTV_PORT:-8097}:8097"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-fintv}
      POSTGRES_USER: ${POSTGRES_USER:-fintv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintv}
      FINTV_API_KEY: ${FINTV_API_KEY:-change-me}
      FINTV_ADMIN_USER: ${FINTV_ADMIN_USER:-admin}
      FINTV_ADMIN_PASSWORD: ${FINTV_ADMIN_PASSWORD:-changeme}
      FINTV_CONFIG: /config
      JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin:8096}
      TZ: ${TZ:-America/Chicago}
    volumes:
      - fintv-config:/config
      - ${FINTV_MEDIA:-./media}:/media
    restart: unless-stopped

volumes:
  fintv-config:
